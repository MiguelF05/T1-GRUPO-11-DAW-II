server:
  port: 8400

spring:
  application:
    name: ms-riesgo
  rabbitmq:
    host: 192.168.18.91
    port: 5672
  datasource:
    url: jdbc:h2:mem:riesgodb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true